# Linux-only. Included by install.sh after kitty.conf.

# Tiling window managers draw their own borders.
hide_window_decorations yes

# Blur depends on the compositor, so only opacity is set here. Add
# `background_blur` yourself if your compositor supports it.
background_opacity 0.97

# NOT ctrl+shift+N: kitty already binds kitty_mod+1..9 (= ctrl+shift+1..9) to
# first_window/second_window/... for splits within a tab, and clobbering those
# would trade one navigation for another. ctrl+alt is free.
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
# Last tab rather than the ninth, matching the macOS binding.
map ctrl+alt+9 goto_tab -1

map ctrl+alt+p select_tab
