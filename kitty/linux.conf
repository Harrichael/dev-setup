# Linux-only. Included by install.sh after kitty.conf.

# Decorations are left on: a floating desktop (GNOME, Budgie) has no other
# titlebar to drag or close the window by. On a tiling window manager that
# draws its own borders, add `hide_window_decorations yes` to your own
# ~/.config/kitty/kitty.conf, after the dev-setup block.

# Blur depends on the compositor, so only opacity is set here. Add
# `background_blur` yourself if your compositor supports it.
background_opacity 0.97
