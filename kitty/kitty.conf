# Shared kitty config. install.sh includes this plus macos.conf or linux.conf.
#
# Why kitty at all: Ghostty and Alacritty both use native macOS NSWindow tabs,
# so a window manager sees one window per tab and re-tiles on every tab switch.
# Measured with three tabs open: three windows for Ghostty, one for kitty, which
# draws its own tab bar instead.

# --- Font -------------------------------------------------------------------
# Menlo is what Ghostty was falling back to and is the main reason the terminal
# read as dated. NFM is the cell-width Nerd Font variant: icons stay inside one
# cell, so prompt glyphs cannot shove the line around.
font_family      JetBrainsMono NFM
bold_font        auto
italic_font      auto
font_size        13.0

# Ligatures are on by default; suppress them only under the cursor, where a
# fused -> or != makes it ambiguous which character you are actually on.
disable_ligatures cursor

modify_font cell_height 110%

# --- Colors: One Dark -------------------------------------------------------
# Ghostty's default pairs this background with Tomorrow Night's ANSI colors,
# which is a mismatch. This is the palette that background belongs to.
background            #282c34
foreground            #abb2bf
selection_background  #3e4451
selection_foreground  #ffffff
cursor                #61afef
cursor_text_color     #282c34
url_color             #61afef

color0  #3f4451
color8  #4f5666
color1  #e06c75
color9  #ff7b86
color2  #98c379
color10 #b5e890
color3  #e5c07b
color11 #ffd68a
color4  #61afef
color12 #7cc4ff
color5  #c678dd
color13 #dd9bf0
color6  #56b6c2
color14 #6fd3e0
color7  #abb2bf
color15 #ffffff

# --- Cursor -----------------------------------------------------------------
cursor_shape           block
cursor_blink_interval  0

# A short motion trail when the cursor jumps. Cheap, and the single biggest
# cue that this is a current-generation terminal rather than a 2012 one.
cursor_trail                  3
cursor_trail_decay            0.1 0.4
cursor_trail_start_threshold  2

# --- Window -----------------------------------------------------------------
# Ghostty's 2px padding is cramped; breathing room reads as modern more than
# any color choice does.
window_padding_width   14

# --- Tab bar ----------------------------------------------------------------
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_align        left
tab_bar_min_tabs     2
active_tab_background   #61afef
active_tab_foreground   #282c34
active_tab_font_style   bold
inactive_tab_background #2c313a
inactive_tab_foreground #6b7280
tab_bar_background      #21252b
tab_title_template      "{index}: {title}"

# --- Misc -------------------------------------------------------------------
enable_audio_bell    no
visual_bell_duration 0.05
scrollback_lines     100000

# --- Tab keys ---------------------------------------------------------------
# Digits go on alt, not ctrl: every ctrl+digit except 1 and 9 transmits a real
# control code -- ctrl+2 NUL, ctrl+3 ESC, ctrl+4 ctrl-\, ctrl+5 ctrl-], ctrl+6
# ctrl-^ (vim's alternate-file), ctrl+7 ctrl-_ (undo in zsh and readline),
# ctrl+8 DEL -- and binding those would swallow them before the shell or editor
# ever saw them. alt is free by comparison: nothing binds bare alt globally, and
# kitty's own split bindings live on cmd and ctrl+shift.
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
# Positive values clamp to the rightmost tab. NOT -1: kitty documents zero and
# negative numbers as "go to previously active tabs", i.e. an MRU toggle, which
# is not what "last tab" means here.
map alt+9 goto_tab 99

map alt+w close_tab
# alt+p, not ctrl+shift+p: the latter is kitty's hints-kitten prefix
# (open-URL, path select), and overriding it would cost those.
map alt+p select_tab

# New tabs inherit the cwd; new OS windows deliberately do not. kitty's
# default `new_tab` takes its cwd from the kitty *process*, which is home when
# launched from the dock, so every tab landed in ~ regardless of where you
# were. `launch --cwd=current` reads it from the active window instead.
# new_os_window is left alone precisely because it keeps the old behavior:
# a new window is a fresh start, a new tab is a continuation.
map ctrl+shift+t launch --cwd=current --type=tab

# --- ctrl+t / ctrl+w, shared with the browser -------------------------------
# One reflex for "new tab" and "close tab" regardless of which app is in front.
# Chrome cannot be configured at all on macOS, so hammerspoon/init.lua rewrites
# these to cmd there; kitty is the side that can just bind them.
#
# The cost is real and chosen: kitty intercepts both, so the shell never sees
# ctrl+w backward-kill-word or ctrl+t transpose-chars. zshrc binds ctrl+backspace
# to backward-kill-word, which is the replacement; transpose-chars had no user.
#
# Closing is not silent, which is what makes this survivable: kitty's
# confirm_os_window_close defaults to -1 and covers close_tab too, and with shell
# integration on a negative value ignores tabs idling at a prompt. So a tab
# running something -- Claude Code, a build -- asks before it dies, and only an
# already-finished tab closes outright.
map ctrl+t launch --cwd=current --type=tab
map ctrl+w close_tab
