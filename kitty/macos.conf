# macOS-only. Included by install.sh after kitty.conf.

# The window title already appears in the tab; a titlebar copy is noise.
hide_window_decorations    titlebar-only
macos_show_window_title_in menubar

# Blur composites behind the window. Drop it first if it reads badly against
# the window manager's gaps.
background_opacity 0.97
background_blur    32
