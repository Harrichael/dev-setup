# macOS-only. Included by install.sh after kitty.conf.

# The window title already appears in the tab; a titlebar copy is noise.
hide_window_decorations    titlebar-only
macos_show_window_title_in menubar

# Blur composites behind the window. Drop it first if it reads badly against
# the window manager's gaps.
background_opacity 0.97
background_blur    32

# Ghostty's most-used shortcut. kitty does bind cmd+1..9 by default, but to
# first_window..ninth_window -- jumping between *splits* inside a tab, not
# between tabs. Repointing them at tabs is the deliberate trade: tab jumping is
# the muscle memory being preserved, and split-by-number goes unbound. Splits
# are still reachable with cmd+opt+arrows.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
# Ghostty's cmd+9 means "last tab", not "ninth"; -1 is kitty's equivalent, so a
# varying tab count still lands on the rightmost.
map cmd+9 goto_tab -1

# Fuzzy tab picker, for when the tab count outgrows the number row.
map cmd+shift+p select_tab
