# AeroSpace config. Symlinked from ~/.config/aerospace/aerospace.toml by
# install.sh -- a symlink rather than an include because TOML has no include
# directive and AeroSpace never rewrites this file.
#
# Modifier scheme, which the kitty and Karabiner configs also follow:
#   cmd       workspaces and window-level navigation
#   cmd+alt   layout, focus movement, monitors -- the second tier, kept off
#             bare cmd because cmd+arrows is Back/Forward in every browser
#   ctrl      in-app navigation (tabs) -- see kitty/macos.conf
#   alt       left free; AeroSpace's own defaults use it and nothing here does

config-version = 2
start-at-login = true
auto-reload-config = true

persistent-workspaces = ['W', '1', '2', '3', '4', '5']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[mode.main.binding]

# --- Workspaces -------------------------------------------------------------
# Bare cmd+1..9 is deliberately left UNBOUND. An AeroSpace binding is a global
# hotkey, so binding it would take tab-by-number away from every app -- Chrome
# in particular, which has no rebinding mechanism at all.
#
# cmd+ctrl, not cmd+shift: with Command and Globe swapped, the bottom-left row
# is cmd/ctrl/alt, so cmd+ctrl is a one-hand roll while shift means reaching up.
# AeroSpace cannot bind fn/Globe at all ("Can't parse modifiers" -- it only
# knows cmd/alt/ctrl/shift), so the preferred cmd+fn+N is layered on top of
# these by Karabiner rather than replacing them. That way the native chord keeps
# working if Karabiner is off.
cmd-ctrl-1 = 'workspace 1'
cmd-ctrl-2 = 'workspace 2'
cmd-ctrl-3 = 'workspace 3'
cmd-ctrl-4 = 'workspace 4'
cmd-ctrl-5 = 'workspace 5'
# NOT w: with Karabiner off, cmd+fn+w degrades to a bare cmd+w and closes
# the focused tab. cmd+0 degrades to "reset zoom", which is harmless.
cmd-ctrl-0 = 'workspace W'

# These shadow Microsoft Word's Apply-Heading-1/2/3 styles, which is a real
# cost if Word is in use. AeroSpace has no per-app binding conditions, so
# there is no way to make an exception for one app.
cmd-alt-1 = 'move-node-to-workspace 1'
cmd-alt-2 = 'move-node-to-workspace 2'
cmd-alt-3 = 'move-node-to-workspace 3'
cmd-alt-4 = 'move-node-to-workspace 4'
cmd-alt-5 = 'move-node-to-workspace 5'
cmd-alt-0 = 'move-node-to-workspace W'

# --- "Last used", at two scopes ---------------------------------------------
# alt+tab and alt+backtick are NOT claimed by macOS, so these work with no
# Karabiner involvement. cmd+tab is unusable directly: macOS consumes it in the
# WindowServer, above global hotkeys, so AeroSpace never sees the keystroke --
# the binding appears to do nothing while the App Switcher jumps you to another
# workspace. F18-F20 exist as targets for Karabiner to rewrite cmd+tab and
# cmd+fn+tab into; pressing them directly tests the AeroSpace half alone.
#
# focus-back-and-forth is deliberately NOT used: it tracks the last focused
# window globally, so from workspace 1 it jumps you to workspace 2. dfs-next
# with explicit boundaries stays inside the workspace. The cost is positional
# cycling rather than MRU -- a toggle with two windows, a cycle with three or
# more. AeroSpace has no workspace-scoped MRU.
# alt+tab is captured globally, including inside remote-desktop and VM
# sessions, where the guest OS may want it. Use the service mode or the
# F-keys if you need it forwarded.
alt-tab = 'focus dfs-next --boundaries workspace --boundaries-action wrap-around-the-workspace'
alt-shift-tab = 'focus dfs-prev --boundaries workspace --boundaries-action wrap-around-the-workspace'

# Only F20 is bound, as the target of Karabiner's cmd+fn+tab. F18/F19 were
# targets for a cmd+tab rewrite that was abandoned, so nothing emitted them and
# no laptop keyboard has those keys -- dead bindings, removed.
f20 = 'workspace-back-and-forth'

# --- Focus and move ---------------------------------------------------------
cmd-alt-left = 'focus left'
cmd-alt-down = 'focus down'
cmd-alt-up = 'focus up'
cmd-alt-right = 'focus right'

cmd-alt-shift-left = 'move left'
cmd-alt-shift-down = 'move down'
cmd-alt-shift-up = 'move up'
cmd-alt-shift-right = 'move right'

# --- Layout -----------------------------------------------------------------
# cmd-alt-f, not cmd-f: cmd-f is Find everywhere.
cmd-alt-f = 'fullscreen'
cmd-alt-slash = 'layout tiles horizontal vertical'
cmd-alt-comma = 'layout accordion horizontal vertical'
# alt-space, not cmd-alt-space: macOS symbolic hotkey 65 (Show Finder search)
# owns cmd+alt+space at the WindowServer level, above global hotkeys, so the
# binding would silently lose exactly the way cmd+tab did.
alt-space = 'layout floating tiling'
# Suspends tiling entirely, which is the closest thing to "float this whole
# space". There is no per-workspace floating mode.
cmd-alt-e = 'enable toggle'
cmd-alt-b = 'balance-sizes'
cmd-alt-r = 'flatten-workspace-tree'
cmd-alt-minus = 'resize smart -50'
cmd-alt-equal = 'resize smart +50'

# --- Monitors ---------------------------------------------------------------
cmd-alt-leftSquareBracket = 'focus-monitor prev'
cmd-alt-rightSquareBracket = 'focus-monitor next'
cmd-alt-shift-leftSquareBracket = 'move-node-to-monitor prev'
cmd-alt-shift-rightSquareBracket = 'move-node-to-monitor next'

# --- Launchers --------------------------------------------------------------
# An AeroSpace binding is a global hotkey, so it is seen before the focused app
# gets a chance -- which is why cmd-shift-i works here even though Chrome binds
# it internally. `open -na ... --new-window` forces a genuinely new window
# instead of activating an existing one.
# These shadow app shortcuts, which is the point -- a global hotkey is seen
# before the focused app, so Chrome cannot hijack cmd+shift+i. The cost is real
# though: cmd+shift+t was Chrome's Reopen Closed Tab and cmd+shift+c was its
# DevTools element picker. cmd+alt+i and cmd+alt+j still open DevTools.
cmd-shift-i = 'exec-and-forget open -na "Google Chrome" --args --new-window'
cmd-shift-c = 'exec-and-forget open -na kitty'
cmd-shift-t = 'exec-and-forget open -na Terminal'

# --- Service mode -----------------------------------------------------------
cmd-alt-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
cmd-alt-shift-left = ['join-with left', 'mode main']
cmd-alt-shift-down = ['join-with down', 'mode main']
cmd-alt-shift-up = ['join-with up', 'mode main']
cmd-alt-shift-right = ['join-with right', 'mode main']

# =====================================================================
# APP -> WORKSPACE RULES
# =====================================================================

# The secondary terminal is a scratch window, not part of the tiling layout.
# Its transparency is a Terminal.app profile setting, not something AeroSpace
# or this file controls.
[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['move-node-to-workspace W']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace W']
